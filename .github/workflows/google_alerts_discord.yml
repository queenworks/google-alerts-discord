name: Google Alerts to Discord

on:
  schedule:
    # JST 07:30 / 19:30
    - cron: "30 22,10 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-alerts:
    runs-on: ubuntu-latest

    env:
      RSS_4K_INVEST: ${{ secrets.RSS_4K_INVEST }}
      DISCORD_4K_WEBHOOK: ${{ secrets.DISCORD_4K_WEBHOOK }}

      RSS_WEATHER_BOSAI: ${{ secrets.RSS_WEATHER_BOSAI }}
      DISCORD_WEATHER_BOSAI_WEBHOOK: ${{ secrets.DISCORD_WEATHER_BOSAI_WEBHOOK }}

      RSS_FIREWORKS: ${{ secrets.RSS_FIREWORKS }}
      DISCORD_FIREWORKS_WEBHOOK: ${{ secrets.DISCORD_FIREWORKS_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Google Alerts to Discord
        run: python google_alerts_to_discord.py

      - name: Commit updated seen state
        run: |
          if [ ! -f state/google_alerts_seen.json ]; then
            echo "No state file yet."
            exit 0
          fi

          if git diff --quiet state/google_alerts_seen.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/google_alerts_seen.json
          git commit -m "Update Google Alerts seen state"
          git push
