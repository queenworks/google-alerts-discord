name: Google Alerts to Discord

on:
  schedule:
    # JST 05:00 / 13:00 / 19:00
    # UTC 20:00 / 04:00 / 10:00
    - cron: "0 20,4,10 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-alerts:
    runs-on: ubuntu-latest

    env:
      WATCH1_RSS: ${{ secrets.WATCH1_RSS }}
      WATCH1_WEBHOOK: ${{ secrets.WATCH1_WEBHOOK }}
      WATCH1_HUB: ${{ secrets.WATCH1_HUB }}
      WATCH1_NAME: ${{ secrets.WATCH1_NAME }}
      WATCH1_USERNAME: ${{ secrets.WATCH1_USERNAME }}
      WATCH1_PREFIX: ${{ secrets.WATCH1_PREFIX }}

      WATCH2_RSS: ${{ secrets.WATCH2_RSS }}
      WATCH2_WEBHOOK: ${{ secrets.WATCH2_WEBHOOK }}
      WATCH2_HUB: ${{ secrets.WATCH2_HUB }}
      WATCH2_NAME: ${{ secrets.WATCH2_NAME }}
      WATCH2_USERNAME: ${{ secrets.WATCH2_USERNAME }}
      WATCH2_PREFIX: ${{ secrets.WATCH2_PREFIX }}

      WATCH3_RSS: ${{ secrets.WATCH3_RSS }}
      WATCH3_WEBHOOK: ${{ secrets.WATCH3_WEBHOOK }}
      WATCH3_HUB: ${{ secrets.WATCH3_HUB }}
      WATCH3_NAME: ${{ secrets.WATCH3_NAME }}
      WATCH3_USERNAME: ${{ secrets.WATCH3_USERNAME }}
      WATCH3_PREFIX: ${{ secrets.WATCH3_PREFIX }}

      RSS_FIREWORKS_GLOBAL: ${{ secrets.RSS_FIREWORKS_GLOBAL }}
      DISCORD_FIREWORKS_WEBHOOK: ${{ secrets.DISCORD_FIREWORKS_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Google Alerts to Discord
        run: python google_alerts_to_discord.py

      - name: Commit updated seen state
        run: |
          if [ ! -f state/google_alerts_seen.json ]; then
            echo "No state file yet."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/google_alerts_seen.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update seen state"
          git push
