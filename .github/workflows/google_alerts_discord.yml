name: Google Alerts to Discord

on:
  schedule:
    # JST 05:00 / 13:00 / 19:00
    # UTC 20:00 / 04:00 / 10:00
    - cron: "0 20,4,10 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-alerts:
    runs-on: ubuntu-latest

    env:
      RSS_4K_APPLE: ${{ secrets.RSS_4K_APPLE }}
      DISCORD_4K_APPLE_WEBHOOK: ${{ secrets.DISCORD_4K_APPLE_WEBHOOK }}
    
      RSS_4K_KIOXIA: ${{ secrets.RSS_4K_KIOXIA }}
      DISCORD_4K_KIOXIA_WEBHOOK: ${{ secrets.DISCORD_4K_KIOXIA_WEBHOOK }}
    
      RSS_4K_NAND: ${{ secrets.RSS_4K_NAND }}
      DISCORD_4K_NAND_WEBHOOK: ${{ secrets.DISCORD_4K_NAND_WEBHOOK }}

      RSS_FIREWORKS_GLOBAL: ${{ secrets.RSS_FIREWORKS_GLOBAL }}
      DISCORD_FIREWORKS_WEBHOOK: ${{ secrets.DISCORD_FIREWORKS_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Google Alerts to Discord
        run: python google_alerts_to_discord.py

      - name: Commit updated seen state
        run: |
          if [ ! -f state/google_alerts_seen.json ]; then
            echo "No state file yet."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/google_alerts_seen.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update seen state"
          git push
